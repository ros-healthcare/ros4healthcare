name: Build and Create Debians

on:
  pull_request:
    branches:
      - '**'

jobs:
  build-debs:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - ros_distro: humble
            arch: amd64
            os_version: jammy
            runner: ubuntu-22.04
          - ros_distro: humble
            arch: arm64
            os_version: jammy
            runner: ubuntu-22.04
          - ros_distro: jazzy
            arch: amd64
            os_version: noble
            runner: ubuntu-24.04
          - ros_distro: jazzy
            arch: arm64
            os_version: noble
            runner: ubuntu-24.04

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create build script for Docker
        run: |
          cat <<'EOF' > build_in_docker.sh
          #!/bin/bash
          set -e

          ROS_DISTRO=$1
          OS_VERSION=$2

          echo "==== Installing build dependencies for ROS $ROS_DISTRO ($OS_VERSION) ===="

          apt update
          DEBIAN_FRONTEND=noninteractive apt install -y \
            git python3-colcon-common-extensions python3-rosdep \
            dpkg-dev fakeroot devscripts build-essential \
            debhelper dh-python python3-pip python3-bloom \
            ca-certificates curl \
            ros-$ROS_DISTRO-rosidl-generator-c \
            ros-$ROS_DISTRO-rosidl-generator-cpp \
            ros-$ROS_DISTRO-ament-cmake \
            ros-$ROS_DISTRO-builtin-interfaces

          if [ "$OS_VERSION" = "noble" ]; then
            echo "Detected Ubuntu Noble"
          else
            echo "Detected Ubuntu $OS_VERSION"
            apt install -y python3-ament-package
          fi

          # healthcare_msgs isn't in the ROS apt repos; take it from the signed
          # apt repo its own CI publishes (one repo per <distro>-<arch>).
          # KEY.gpg is ASCII-armored, so it is stored as .asc for signed-by.
          DEB_ARCH=$(dpkg --print-architecture)
          HC_MSGS_REPO="https://scai-lab.github.io/healthcare_msgs/${ROS_DISTRO}-${DEB_ARCH}"
          curl -fsSL "$HC_MSGS_REPO/KEY.gpg" -o /usr/share/keyrings/healthcare-msgs.asc
          echo "deb [arch=${DEB_ARCH} signed-by=/usr/share/keyrings/healthcare-msgs.asc] $HC_MSGS_REPO ${ROS_DISTRO}-${OS_VERSION} main" \
            > /etc/apt/sources.list.d/healthcare-msgs.list
          apt update

          source /opt/ros/$ROS_DISTRO/setup.bash
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/opt/ros/$ROS_DISTRO/lib
          export AMENT_PREFIX_PATH=/opt/ros/$ROS_DISTRO:$AMENT_PREFIX_PATH
          export CMAKE_PREFIX_PATH=/opt/ros/$ROS_DISTRO:$CMAKE_PREFIX_PATH

          echo "==== Environment setup complete ===="

          # Keep the default rosdep sources: they hold the rules for system
          # keys such as python3-setuptools, without which bloom-generate fails
          # on the first package. The local list is named 10-* so it is read
          # before 20-default.list and its rules take precedence.
          mkdir -p /etc/ros/rosdep/sources.list.d
          echo "yaml file:///tmp/rosdep_combined_override.yaml" > /etc/ros/rosdep/sources.list.d/10-local.list

          if [ -f /workspace/rosdep_override.yaml ]; then
            cat /workspace/rosdep_override.yaml > /tmp/rosdep_combined_override.yaml
          else
            echo "# Static override not found, starting with empty file" > /tmp/rosdep_combined_override.yaml
          fi

          echo "healthcare_msgs:" >> /tmp/rosdep_combined_override.yaml
          echo "  ubuntu:" >> /tmp/rosdep_combined_override.yaml
          echo "    $OS_VERSION: [ros-$ROS_DISTRO-healthcare-msgs]" >> /tmp/rosdep_combined_override.yaml

          for pkg in $(colcon list --names-only); do
            deb_pkg="ros-$ROS_DISTRO-${pkg//_/-}"
            echo "$pkg:" >> /tmp/rosdep_combined_override.yaml
            echo "  ubuntu:" >> /tmp/rosdep_combined_override.yaml
            echo "    $OS_VERSION: [$deb_pkg]" >> /tmp/rosdep_combined_override.yaml
          done

          echo "===== ROSDEP COMBINED FILE ====="
          cat /tmp/rosdep_combined_override.yaml
          echo "================================"

          rosdep init || true
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y \
            --skip-keys="builtin_interfaces rclcpp rclpy"

          mkdir -p /workspace/debs
          INITIAL_DIR=$(pwd)

          for pkg in $(colcon list --paths-only --topological-order); do
            echo "Processing package: $pkg"
            cd $pkg

            bloom-generate rosdebian --ros-distro $ROS_DISTRO --os-name ubuntu --os-version $OS_VERSION

            # Remove shlibs dependencies for pure-Python packages
            if ! grep -r --include='CMakeLists.txt' 'add_executable\|ament_target_dependencies' .; then
              echo "No C++ binaries detected, removing \${shlibs:Depends} from debian/control"
              sed -i 's/${shlibs:Depends},\s*//g' debian/control
              sed -i 's/${shlibs:Depends}//g' debian/control
            fi

            fakeroot debian/rules binary

            find .. -maxdepth 2 -name '*.deb' -exec mv {} /workspace/debs/ \;
            dpkg -i /workspace/debs/*.deb || apt-get install -f -y

            source /opt/ros/$ROS_DISTRO/setup.bash
            cd $INITIAL_DIR
          done
          EOF

          chmod +x build_in_docker.sh

      - name: Run Docker container to build packages
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            IMAGE="arm64v8/ros:${{ matrix.ros_distro }}-ros-base"
          else
            IMAGE="ros:${{ matrix.ros_distro }}-ros-base"
          fi

          echo "Using Docker image: $IMAGE"

          docker run --rm --privileged --platform linux/${{ matrix.arch }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            $IMAGE bash /workspace/build_in_docker.sh \
              ${{ matrix.ros_distro }} ${{ matrix.os_version }}

      - name: Upload .deb files as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ros-debian-packages-${{ matrix.ros_distro }}-${{ matrix.arch }}
          path: debs/*.deb


